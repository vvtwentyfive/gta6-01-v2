<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Neon Harbor — a 3D open-world crime game. Steal cars, outrun the police, and work through seven story missions in a seeded harbor city. Plays offline in desktop Chrome.">
<title>Neon Harbor — Open World</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14100c; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Harbor: a 3D open-world crime game. Steal cars, outrun the police and finish jobs across the harbor city"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script src="./bundle.js"></script>
</body>
</html>
